# Fix Colors
set -as terminal-features ",xterm-256color:RGB"
# Tell tmux this terminal can display Sixel graphics (otherwise it substitutes a placeholder)
set -as terminal-features ",xterm-256color:sixel"

# Required for image.nvim to pass the Kitty graphics protocol through tmux
set -gq allow-passthrough on
set -g visual-activity off
set -g focus-events on

bind I source-file ~/.tmux.conf \; display-message "Config reloaded!"

bind-key b set-option status

# move around split windows
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Copying from tmux
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
unbind -T copy-mode-vi Space

# Get rid of confirmation
bind-key & kill-window
bind-key x kill-pane

# Set default directory for new windows in this session to current directory:
bind M-c attach-session -c "#{pane_current_path}"
# open a new window in the current directory
bind C new-window -c "#{pane_current_path}"

# Start windows at 1, not 0
set -g base-index 1

# Swap current window with window 1 using Prefix + S
bind-key S swap-window -t 1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-custom-paths '/home/finley/projects, /home/finley/dotfiles/main/.config, /home/finley/notes/, /mnt/c/Users/finle/latex, /mnt/c/Users/finle/IdeaProjects/'
set -g @sessionx-custom-paths-subdirectories 'true'

# --- Session persistence (tmux-resurrect + tmux-continuum) ---
# Restore pane contents (not just layout) where the running program supports it
set -g @resurrect-capture-pane-contents 'on'
# Panes running `claude` (any args) get relaunched with --continue so the
# restored pane resumes its last conversation instead of booting a fresh one
set -g @resurrect-processes '"~claude->claude --continue"'
# If a pane's directory has a Session.vim (written by vim-obsession), restore
# nvim via `nvim -S` for full window/buffer layout instead of a bare reopen
set -g @resurrect-strategy-nvim 'session'
# Autosave every 1 min and auto-restore the last save when tmux starts
set -g @continuum-save-interval '1'
set -g @continuum-restore 'on'

set -g status-right "#[fg=#5f8787]%H:%M %d-%b-%y"

# Ensure 24-bit color support
set -ga terminal-overrides ",xterm-256color:Tc"

# --- General Theme ---
set -g status-style bg="#000000",fg="#c1c1c1"
setw -g window-status-current-style fg="#ddeecc",bg="#00000f",bold
set -g status-right-style fg="#5f8787"
setw -g window-status-style fg="#505050",bg=default

# set -g @plugin 'niksingh710/minimal-tmux-status'
# set -g @minimal-tmux-indicator-str "(ᵔᴥᵔ)"
# set -g @minimal-tmux-justify "centre"
# set -g @minimal-tmux-use-arrow true
# set -g @minimal-tmux-right-arrow ""
# set -g @minimal-tmux-left-arrow ""
# set -g @minimal-tmux-fg "#000000"
# set -g @minimal-tmux-bg "#777777"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
