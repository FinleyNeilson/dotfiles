# Fix Colors
set -as terminal-features ",xterm-256color:RGB"
# Tell tmux this terminal can display Sixel graphics (otherwise it substitutes a placeholder)
set -as terminal-features ",xterm-256color:sixel"

set -g extended-keys on

# Required for image.nvim to pass the Kitty graphics protocol through tmux
set -gq allow-passthrough on
set -g visual-activity off
set -g focus-events on

# Popups inherit the tmux server env, not the shell, so set the editor here too
set-environment -g EDITOR nvim
set-environment -g VISUAL nvim

# Let tmux handle mouse wheel scrolling/copy-mode.
set -g mouse on

# Let tmux handle mouse wheel scrolling/copy-mode.
set -g mouse on

bind I source-file ~/.tmux.conf \; display-message "Config reloaded!"

bind-key b set-option status

# Hunk runs full screen in a popup over the current pane. Claude leaves review
# notes in .git/hunk-notes.json; when that file exists it is loaded as agent
# context, and --watch picks up both code and note changes live.
# Review current repo changes
bind-key g display-popup -E -B -w 100% -h 100% -d "#{pane_current_path}" 'n=$(git rev-parse --git-path hunk-notes.json 2>/dev/null) && [ -f "$n" ] && set -- --agent-context "$n"; ~/.hunk/bin/hunk diff --watch "$@"'
# Review the whole branch against the default branch (jj: trunk(); git: origin/HEAD, else main)
bind-key G display-popup -E -B -w 100% -h 100% -d "#{pane_current_path}" 'n=$(git rev-parse --git-path hunk-notes.json 2>/dev/null) && [ -f "$n" ] && set -- --agent-context "$n"; if jj root >/dev/null 2>&1; then ~/.hunk/bin/hunk diff --watch "$@" "trunk()..@"; else ~/.hunk/bin/hunk diff --watch "$@" "$(git rev-parse --abbrev-ref --verify -q origin/HEAD 2>/dev/null || echo main)...HEAD"; fi'

# move around split windows
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Copying from tmux
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
unbind -T copy-mode-vi Space

# Get rid of confirmation
bind-key & kill-window
bind-key x kill-pane
# Close every other pane in the window, keeping the current one
bind-key X kill-pane -a

# Set default directory for new windows in this session to current directory:
bind M-c attach-session -c "#{pane_current_path}"
# open a new window in the current directory
bind C new-window -c "#{pane_current_path}"

# Start windows at 1, not 0
set -g base-index 1

# Swap current window with window 1 using Prefix + S
bind-key S swap-window -t 1

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-custom-paths '/home/finley/projects, /home/finley/dotfiles/main/.config, /home/finley/notes/, /mnt/c/Users/finle/latex, /mnt/c/Users/finle/IdeaProjects/'
set -g @sessionx-custom-paths-subdirectories 'true'

# --- Session persistence (tmux-resurrect + tmux-continuum) ---
# Restore pane contents (not just layout) where the running program supports it
set -g @resurrect-capture-pane-contents 'on'
# Panes running `claude` (any args) get relaunched with --continue so the
# restored pane resumes its last conversation instead of booting a fresh one
set -g @resurrect-processes '"~claude->claude --continue"'
# If a pane's directory has a Session.vim (written by vim-obsession), restore
# nvim via `nvim -S` for full window/buffer layout instead of a bare reopen
set -g @resurrect-strategy-nvim 'session'
# Autosave every 1 min and auto-restore the last save when tmux starts
set -g @continuum-save-interval '1'
set -g @continuum-restore 'on'

set -g status-right "#[fg=#3ea290]%H:%M %d-%b-%y"

# Ensure 24-bit color support
set -ga terminal-overrides ",xterm-256color:Tc"

# --- General Theme (Mikazuki) ---
# Every colour below is taken from the terminal palette, so the status line and
# the shell agree. Mikazuki's slots are not literal: its "magenta" is orange
# (#ff850d) and its "cyan" is purple (#8c16da), so these are written as hex
# rather than by name.
#
#   #000000  background        #2a1d17  black      #4f362b  bright black
#   #3ea290  blue/teal         #8ca8a3  bright blue (sage)
#
# Teal #3ea290 is the single accent, used for the current window, the clock and
# the prefix indicator.
set -g status-style bg="#000000",fg="#8ca8a3"
# Current window: teal on the palette's warm near-black, which reads as a raised
# block against the true-black status bar
setw -g window-status-current-style fg="#3ea290",bg="#2a1d17",bold
set -g status-right-style fg="#3ea290"
# Light up the session name while the prefix key is active
set -g status-left "#{?client_prefix,#[fg=#000000#,bg=#3ea290#,bold],}[#{session_name}]#[default] "
setw -g window-status-style fg="#4f362b",bg=default

# Pane borders. The active border keeps tmux's stock conditional, so it still
# flags copy mode (yellow) and synchronised panes (red) instead of always teal.
setw -g pane-border-style fg="#4f362b"
setw -g pane-active-border-style "#{?pane_in_mode,fg=#e3da84,#{?synchronize-panes,fg=#da1657,fg=#3ea290}}"

# Copy mode: teal selection, yellow search hits, red for the one under the
# cursor so it stands out from the rest.
setw -g mode-style fg="#000000",bg="#3ea290"
setw -g copy-mode-match-style fg="#000000",bg="#e3da84"
setw -g copy-mode-current-match-style fg="#000000",bg="#da4375"
setw -g copy-mode-mark-style fg="#000000",bg="#8ca8a3"

# Status-line messages, and the command prompt (prefix + :), which is dimmed so
# it reads as input rather than as a notification.
set -g message-style fg="#000000",bg="#3ea290"
set -g message-command-style fg="#8ca8a3",bg="#2a1d17"

# Pane numbers (prefix + q) and the clock (prefix + t)
set -g display-panes-colour "#8ca8a3"
set -g display-panes-active-colour "#3ea290"
setw -g clock-mode-colour "#3ea290"

# Menus, with the same teal selection bar as copy mode
setw -g menu-style fg="#8ca8a3",bg="#2a1d17"
setw -g menu-selected-style fg="#000000",bg="#3ea290"
setw -g menu-border-style fg="#4f362b"

# Popup border only (prefix + g/G run hunk in a popup, as does sessionx).
# popup-style is left at default on purpose: forcing fg/bg there would override
# the colours of whatever program is running inside the popup.
setw -g popup-border-style fg="#3ea290"

